name: 4D-MGRFF Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Audit (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .[dev]

      - name: Run code formatting check (Black)
        run: |
          python -m black --check --line-length 120 models/ src/ tests/

      - name: Run static analysis (Flake8)
        run: |
          python -m flake8 models/ src/ tests/ --max-line-length 120 --ignore E501,W503

      - name: Execute test suite (Pytest)
        run: |
          python -m pytest tests/ -v

      - name: Verify master dissertation manuscript compilation
        run: |
          python compile_master_manuscript.py
